name: build

on:
  push:
    tags:
      - "v*"

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        component: [ticketing-system, ticketing-mcp-server]
    steps:
      - uses: actions/checkout@v4

      - name: Log in to quay.io
        run: |
          echo "${{ secrets.QUAY_PASSWORD }}" | podman login quay.io \
            -u "${{ secrets.QUAY_USERNAME }}" --password-stdin

      - name: Build
        run: |
          podman build -t "quay.io/sovereign-selfheal/${{ matrix.component }}:${GITHUB_REF_NAME}" \
            "${{ matrix.component }}"

      - name: Push
        run: |
          podman push "quay.io/sovereign-selfheal/${{ matrix.component }}:${GITHUB_REF_NAME}"

      - name: Resolve pushed digest
        run: |
          skopeo inspect "docker://quay.io/sovereign-selfheal/${{ matrix.component }}:${GITHUB_REF_NAME}" \
            | tee /tmp/inspect.json
          echo "${{ matrix.component }} digest: $(jq -r .Digest /tmp/inspect.json)"
          echo "Copy this digest into gitops components/${{ matrix.component }}/values.yaml"
