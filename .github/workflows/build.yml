name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# Quay builds and pushes both images on git tags (build trigger). This workflow only
# checks that the images build; it pushes nothing.
jobs:
  build-and-smoke:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        component: [ticketing-system, ticketing-mcp-server]
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Build the image (no push)
        run: podman build -t "localhost/${{ matrix.component }}:ci" "${{ matrix.component }}"
